name: Tool or feature request
description: A new tool must earn its place. Say what find, invoke, set_value and click cannot already do.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Why the existing tools do not cover it
      description: See the tool list in the README.
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: What could go wrong
      description: Would it need input, the clipboard, files or a process? Should it be reachable under `--read-only`?
