name: eval-gate

# PR gate: the golden set must keep its success rate. Runs on every push to
# a PR branch, on schedule (drift check against main) and by hand with a
# custom threshold.

on:
  pull_request:
    paths:
      - "eval/**"
      - "tools/**"
      - "server/**"
      - "tests/**"
      - ".github/workflows/eval-gate.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      success_threshold:
        description: "Minimum success rate, 0 to 1"
        required: false
        default: "0.8"

concurrency:
  group: eval-gate-${{ github.ref }}
  cancel-in-progress: true

env:
  SUCCESS_THRESHOLD: ${{ github.event.inputs.success_threshold || '0.8' }}

jobs:
  eval-gate:
    name: golden set (${{ env.SUCCESS_THRESHOLD }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # eval/ is stdlib-only on purpose: no uiautomation, no comtypes, no
      # Windows, no display. That is what makes the gate cheap enough to
      # run on every PR.
      - name: Install pytest
        run: python -m pip install pytest

      - name: Runner smoke tests
        run: python -m pytest eval/test_smoke.py -v

      - name: Golden set (fake client)
        run: python eval/run.py --min-success "$SUCCESS_THRESHOLD"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results.json
          if-no-files-found: error

  unit-windows:
    # The real suite needs Windows (uiautomation + comtypes). It is skipped
    # until tests/ has files, so this workflow stays green on a fresh clone.
    name: unit suite (windows)
    runs-on: windows-latest
    if: ${{ hashFiles('tests/**/test_*.py') != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package + pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pytest

      - name: pytest
        run: python -m pytest tests -q
