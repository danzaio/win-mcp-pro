<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">win-mcp-pro</title>
  <desc id="hero-desc">A small Windows UI Automation MCP server. A Notepad window with its UI Automation tree, one verified set_value and one click refused with FRAME_REQUIRED before any input was sent.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="1" stop-color="#0b2644"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0078d4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0078d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#8fd8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="400" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="400" fill="url(#bg)"/>
    <rect width="1200" height="400" fill="url(#grid)"/>
    <circle cx="930" cy="200" r="380" fill="url(#glow)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="399" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.12"/>

  <!-- left column -->
  <text x="64" y="96" font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="14" letter-spacing="2.4" fill="#60cdff">MCP SERVER  ·  WINDOWS UI AUTOMATION</text>
  <text x="64" y="176" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="url(#word)">win-mcp-pro</text>
  <text x="64" y="226" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="28" fill="#d3e6f8">A small Windows MCP server</text>
  <text x="64" y="262" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="28" fill="#d3e6f8">you can read in an afternoon.</text>

  <g font-family="Cascadia Mono, Consolas, ui-monospace, monospace" font-size="15" fill="#bfe6ff">
    <rect x="64" y="298" width="108" height="38" rx="19" fill="#60cdff" fill-opacity="0.12" stroke="#60cdff" stroke-opacity="0.55"/>
    <text x="118" y="322" text-anchor="middle">54 tools</text>
    <rect x="184" y="298" width="128" height="38" rx="19" fill="#60cdff" fill-opacity="0.12" stroke="#60cdff" stroke-opacity="0.55"/>
    <text x="248" y="322" text-anchor="middle">6.0k lines</text>
    <rect x="324" y="298" width="116" height="38" rx="19" fill="#60cdff" fill-opacity="0.12" stroke="#60cdff" stroke-opacity="0.55"/>
    <text x="382" y="322" text-anchor="middle">410 tests</text>
    <rect x="452" y="298" width="232" height="38" rx="19" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.6"/>
    <text x="568" y="322" text-anchor="middle" fill="#9df0c8">refusals send nothing</text>
  </g>

  <!-- right: a window and its UIA tree -->
  <g font-family="Cascadia Mono, Consolas, ui-monospace, monospace">
    <rect x="724" y="60" width="416" height="284" rx="10" fill="#0d1a2c" stroke="#2f5282"/>
    <path d="M724 70a10 10 0 0 1 10-10h396a10 10 0 0 1 10 10v24H724z" fill="#142a47"/>
    <text x="742" y="82" font-family="Segoe UI, system-ui, sans-serif" font-size="13" fill="#a9c2de">Sem título - Bloco de Notas</text>
    <path d="M1070 77h10M1094 72h10v10h-10zM1118 72l10 10m0-10l-10 10" fill="none" stroke="#a9c2de" stroke-width="1.4"/>

    <g font-size="14" fill="#9fb9d6">
      <text x="744" y="124">▾ Window  <tspan fill="#6f8db0">"Notepad"</tspan></text>
      <text x="762" y="152">▾ Pane</text>
    </g>
    <rect x="750" y="164" width="364" height="34" rx="6" fill="#0078d4" fill-opacity="0.2" stroke="#60cdff"/>
    <text x="774" y="186" font-size="14" fill="#e8f6ff">▸ Edit  <tspan fill="#60cdff">20449106:42,…</tspan></text>
    <text x="1100" y="186" font-size="11" text-anchor="end" fill="#8fd8ff">ValuePattern</text>
    <g font-size="14" fill="#9fb9d6">
      <text x="762" y="222">▸ MenuBar</text>
      <text x="762" y="246">▸ StatusBar</text>
    </g>

    <rect x="750" y="262" width="364" height="30" rx="6" fill="#3ddc97" fill-opacity="0.12" stroke="#3ddc97" stroke-opacity="0.7"/>
    <text x="766" y="282" font-size="13" fill="#9df0c8">set_value   ✓ verified by read-back</text>
    <rect x="750" y="300" width="364" height="30" rx="6" fill="#ff6b6b" fill-opacity="0.12" stroke="#ff6b6b" stroke-opacity="0.7"/>
    <text x="766" y="320" font-size="13" fill="#ffb0b0">click       ✗ FRAME_REQUIRED · 0 events</text>
  </g>
</svg>
